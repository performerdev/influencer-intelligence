# Builds and refreshes the open brains.
# Secrets (Settings → Secrets and variables → Actions):
#   TWITTERAPI_IO_KEY, DEEPSEEK_API_KEY, DATABASE_URL
name: Brains

on:
  workflow_dispatch:
    inputs:
      command:
        description: "probe = cheap API check + cost estimate · build = full brain · status = spend report"
        type: choice
        options: [probe, build, status]
        default: probe
      target:
        description: "Handle or code (blknoiz06, ii-01) — or 'all'"
        default: blknoiz06
      max_usd:
        description: "twitterapi.io spend cap per account, USD"
        default: "15"
      partial:
        description: "If the cap is reached, still distill the posts collected so far"
        type: boolean
        default: false
  schedule:
    # Weekly refresh: new posts only, Mondays 03:17 UTC.
    - cron: "17 3 * * 1"

concurrency:
  group: brains-${{ github.event.inputs.target || 'refresh' }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DATABASE_POOL_MAX: "3"
  # Bulk reading of posts on Flash, the final brain on Pro.
  LLM_MODEL_MAP: deepseek-flash
  LLM_MODEL_DISTILL: deepseek-v4-pro
  FORCE_COLOR: "0"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.t.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        name: Resolve targets
        run: |
          T="${{ github.event.inputs.target }}"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "$T" = "all" ]; then
            LIST=$(grep -oE 'handle: "[^"]+"' apps/web/config/intelligences.ts | cut -d'"' -f2 | jq -R . | jq -sc .)
          else
            LIST=$(jq -nc --arg t "$T" '[$t]')
          fi
          echo "targets=$LIST" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        target: ${{ fromJson(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Probe
        if: github.event.inputs.command == 'probe'
        run: |
          set -o pipefail
          { echo '```'; pnpm brain:probe ${{ matrix.target }}; echo '```'; } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Status
        if: github.event.inputs.command == 'status'
        run: |
          set -o pipefail
          { echo '```'; pnpm brain:status; echo '```'; } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build
        if: github.event.inputs.command == 'build'
        run: |
          set -o pipefail
          { echo '```'; pnpm brain:build ${{ matrix.target }} --max-usd ${{ github.event.inputs.max_usd }} ${{ github.event.inputs.partial == 'true' && '--partial' || '' }}; echo '```'; } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Weekly refresh
        if: github.event_name == 'schedule'
        run: |
          set -o pipefail
          { echo '```'; pnpm brain:build ${{ matrix.target }} --refresh --max-usd 5; echo '```'; } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit open brain files
        if: github.event.inputs.command == 'build' || github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brains/
          if git diff --cached --quiet; then echo "No brain changes."; exit 0; fi
          git commit -m "brains: update ${{ matrix.target }}"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
