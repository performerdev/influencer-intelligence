# Builds and refreshes the open brains, and runs paid "Add a brain" builds.
# Secrets (Settings → Secrets and variables → Actions):
#   TWITTERAPI_IO_KEY, DEEPSEEK_API_KEY, DATABASE_URL
name: Brains

on:
  workflow_dispatch:
    inputs:
      command:
        description: "probe = cheap API check + cost estimate · build = full brain · status = spend report · reassemble = rebuild prompts from stored brains (free) · stats = re-price every call (free) · jobs = paid Add builds"
        type: choice
        options: [probe, build, status, reassemble, stats, jobs]
        default: probe
      target:
        description: "Handle or code (blknoiz06, ii-01), several separated by commas — or 'all'"
        default: blknoiz06
      max_usd:
        description: "twitterapi.io spend cap per account, USD"
        default: "15"
      partial:
        description: "If the cap is reached, still distill the posts collected so far"
        type: boolean
        default: false
      replies:
        description: "Also collect replies to other people (with the post each answers); later weekly refreshes keep them up to date"
        type: boolean
        default: false
  schedule:
    # Weekly refresh: new posts only, Mondays 03:17 UTC — and again at 15:17 in case
    # GitHub skipped the first (it does under load); a second run finds nothing new and costs ~nothing.
    - cron: "17 3 * * 1"
    - cron: "17 15 * * 1"
    # Paid "Add a brain" builds: the site also wakes this right after payment when it can.
    - cron: "*/10 * * * *"

concurrency:
  group: brains-${{ github.event.inputs.command || (github.event.schedule == '*/10 * * * *' && 'jobs' || 'refresh') }}-${{ github.event.inputs.target || 'auto' }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  SITE_URL: https://ii.plus
  TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  # several jobs share the Supabase session pooler
  DATABASE_POOL_MAX: "2"
  # Bulk reading of posts on Flash, the final brain on Pro.
  LLM_MODEL_MAP: deepseek-flash
  LLM_MODEL_DISTILL: deepseek-v4-pro
  FORCE_COLOR: "0"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.t.outputs.targets }}
      mode: ${{ steps.t.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - id: mode
        name: Mode
        run: |
          if [ "${{ github.event.schedule }}" = "*/10 * * * *" ] || [ "${{ github.event.inputs.command }}" = "jobs" ]; then echo "mode=jobs" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.target }}" = "all" ]; then echo "mode=all" >> "$GITHUB_OUTPUT";
          else echo "mode=list" >> "$GITHUB_OUTPUT"; fi
      # every brain, including ones added by users (they live only in the database)
      - if: steps.mode.outputs.mode == 'all'
        uses: pnpm/action-setup@v4
      - if: steps.mode.outputs.mode == 'all'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.mode.outputs.mode == 'all'
        run: pnpm install --frozen-lockfile
      - id: t
        name: Resolve targets
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = "jobs" ]; then
            # an idle tick ends here: the site says whether any paid build is waiting (and settles payments)
            Q=$(curl -fsS --max-time 30 "$SITE_URL/api/jobs/pending" | jq -r '.queued // 0' || echo 1)
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$Q" != "0" ]; then LIST='["jobs"]'; else LIST='[]'; fi
          elif [ "$MODE" = "all" ]; then
            LIST=$(pnpm -s brain:list | tail -n 1)
            echo "$LIST" | jq -e 'type == "array"' > /dev/null || LIST=$(grep -oE 'handle: "[^"]+"' apps/web/config/intelligences.ts | cut -d'"' -f2 | jq -R . | jq -sc .)
          else
            LIST=$(jq -nc --arg t "${{ github.event.inputs.target }}" '$t | split(",") | map(gsub("^[\\s@]+|\\s+$"; "")) | map(select(length > 0))')
          fi
          echo "targets=$LIST" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        target: ${{ fromJson(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Paid builds
        if: needs.plan.outputs.mode == 'jobs'
        run: |
          set -o pipefail
          { echo '```'; pnpm brain:jobs; echo '```'; } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Probe
        if: github.event.inputs.command == 'probe'
        run: |
          set -o pipefail
          { echo '```'; pnpm brain:probe ${{ matrix.target }}; echo '```'; } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Status
        if: github.event.inputs.command == 'status'
        run: |
          set -o pipefail
          { echo '```'; pnpm brain:status; echo '```'; } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Reassemble
        if: github.event.inputs.command == 'reassemble'
        run: |
          set -o pipefail
          { echo '```'; pnpm brain:reassemble ${{ matrix.target }}; echo '```'; } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Re-price calls
        if: github.event.inputs.command == 'stats'
        run: |
          set -o pipefail
          { echo '```'; pnpm brain:stats ${{ matrix.target }}; echo '```'; } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build
        if: github.event.inputs.command == 'build'
        run: |
          set -o pipefail
          { echo '```'; pnpm brain:build ${{ matrix.target }} --max-usd ${{ github.event.inputs.max_usd }} ${{ github.event.inputs.partial == 'true' && '--partial' || '' }} ${{ github.event.inputs.replies == 'true' && '--replies' || '' }}; echo '```'; } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Weekly refresh
        if: github.event_name == 'schedule' && needs.plan.outputs.mode == 'all'
        run: |
          set -o pipefail
          { echo '```'; pnpm brain:build ${{ matrix.target }} --refresh --max-usd 5; echo '```'; } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit open brain files
        if: github.event.inputs.command == 'build' || github.event.inputs.command == 'reassemble' || github.event.inputs.command == 'stats' || github.event_name == 'schedule' || needs.plan.outputs.mode == 'jobs'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brains/
          if git diff --cached --quiet; then echo "No brain changes."; exit 0; fi
          git commit -m "brains: update ${{ matrix.target }}"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
